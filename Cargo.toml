# Development workspace. The mod itself is the bundle in `mixins/presto/`: Horizon's launcher
# stages `mixins/presto/core` as a `[[crate]]` of the game and injects `mixins/presto/glue.rs`
# and the hook helpers into horizon-client. This workspace only builds and tests the core crate
# on its own, without a Horizon checkout.
[workspace]
members = ["mixins/presto/core"]
resolver = "3"

[profile.release]
debug = 1

[profile.test]
opt-level = 2
