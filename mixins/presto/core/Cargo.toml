[package]
name = "presto-core"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "LGPL-3.0-or-later"
description = "Presto: Baritone's pathfinding, processes and commands, ported to Rust for Horizon (Minecraft: Java Edition 26.3)"

# Only registry crates already in Horizon's Cargo.lock may be used here: horizon-mixins stages this
# folder as a `[[crate]]` of the game and refuses anything else (docs/native-mods.md).
[dependencies]
flate2 = "1.1"
log = "0.4"
rustc-hash = "2.1"
